id: io.github.tobagin.Ntfyr.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ntfyr
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --socket=system-bus
  - --system-talk-name=org.freedesktop.PolicyKit1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  test-args:
    - --socket=x11
    - --share=network
modules:
  - name: ntfyr
    buildsystem: meson
    run-tests: true
    config-opts:
      - -Dprofile=development
    post-install:
      - |
        set -e
        BUILDDIR="${FLATPAK_BUILDER_BUILDDIR:-/run/build/ntfyr/_flatpak_build}"
        for lang in de es fr ru; do
          src=""
          for candidate in \
            "$BUILDDIR/po/$lang/LC_MESSAGES/ntfyr.mo" \
            "/app/share/locale/$lang/LC_MESSAGES/ntfyr.mo" \
            "/app/share/runtime/locale/$lang/share/$lang/LC_MESSAGES/ntfyr.mo"; do
            if [ -f "$candidate" ]; then
              src="$candidate"
              break
            fi
          done
          if [ -z "$src" ]; then
            echo "Missing translation catalog for $lang" >&2
            exit 1
          fi
          install -Dm644 "$src" "/app/share/ntfyr/locale/$lang/LC_MESSAGES/ntfyr.mo"
        done
    sources:
      - type: dir
        path: ../
