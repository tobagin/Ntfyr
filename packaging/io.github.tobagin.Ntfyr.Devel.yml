id: io.github.tobagin.Ntfyr.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ntfyr
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  test-args:
    - --socket=x11
    - --share=network
modules:
  - name: ntfyr
    buildsystem: meson
    run-tests: true
    config-opts:
      - -Dprofile=development
    post-install:
      - |
        set -e
        # Mirror every catalog meson installed (one per LINGUAS entry) into the
        # app's custom LOCALEDIR, so new languages are picked up automatically.
        found=0
        for mo in /app/share/locale/*/LC_MESSAGES/ntfyr.mo; do
          [ -f "$mo" ] || continue
          lang=$(basename "$(dirname "$(dirname "$mo")")")
          install -Dm644 "$mo" "/app/share/ntfyr/locale/$lang/LC_MESSAGES/ntfyr.mo"
          found=$((found + 1))
        done
        if [ "$found" -eq 0 ]; then
          echo "No translation catalogs found under /app/share/locale" >&2
          exit 1
        fi
    sources:
      - type: dir
        path: ../
