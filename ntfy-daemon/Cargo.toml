[package]
name = "ntfy-daemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3.0"
tokio = { version = "1.0.0", features = ["net", "rt", "macros", "parking_lot"]}
tokio-util = { version = "0.7", features = ["compat", "io"] }
clap = { version = "4.3.11", features = ["derive"] }
anyhow = "1.0.71"
tokio-stream = { version = "0.1.14", features = ["io-util", "time", "sync"] }
rusqlite = "0.39"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-native-certs"]}
url = { version = "2.4.0", features = ["serde"] }
tracing = "0.1.37"
thiserror = "2.0"
regex = "1.9.6"
oo7 = "0.6"
async-trait = "0.1.83"
http = "1.1.0"
async-channel = "2.3.1"
chrono = "0.4.42"
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha2 = "0.10.9"
